<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sakugame Test · Aperçu téléphone</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080f1d;color:#eaf3ff;font-family:system-ui,sans-serif}header{height:64px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 18px;border-bottom:1px solid #ffffff1a;background:#101d30}header strong{display:block;font-size:.95rem}header small{color:#a8bad0;font-size:.7rem}.actions{display:flex;align-items:center;gap:8px}.actions button,.actions a{border:1px solid #52677c;border-radius:8px;background:#1a3049;color:#eaf3ff;font:600 12px system-ui;text-decoration:none;padding:9px;cursor:pointer}main{height:calc(100dvh - 64px);min-height:270px;display:flex;justify-content:center;align-items:center;overflow:hidden;padding:12px}.stage{position:relative;flex:none}.phone{position:absolute;left:0;top:0;width:412px;height:866px;padding:10px;border:1px solid #718196;border-radius:36px;background:#111925;box-shadow:0 25px 70px #000a;transform-origin:top left}.screen{width:390px;height:844px;border:0;border-radius:26px;background:#091222;display:block}@media(max-width:500px){header{padding:0 10px}.actions{gap:5px}.actions button,.actions a{padding:8px;font-size:11px}header small{font-size:.62rem}main{padding:4px}}
</style></head><body><header><div><strong>Aperçu téléphone</strong><small>Site test interactif · écran 390 × 844</small></div><div class="actions"><button id="reload" type="button">Actualiser</button><a href="/" target="_top">Vue normale</a></div></header><main id="area"><div class="stage" id="stage"><div class="phone" id="phone"><iframe class="screen" id="site" title="Sakugame Test en format téléphone" src="/index.html" allow="clipboard-write"></iframe></div></div></main><script>
function fit(){let area=document.getElementById('area'),s=Math.min(1,(area.clientWidth-12)/412,(area.clientHeight-12)/866);s=Math.max(.15,s);document.getElementById('stage').style.width=(412*s)+'px';document.getElementById('stage').style.height=(866*s)+'px';document.getElementById('phone').style.transform='scale('+s+')'}window.addEventListener('resize',fit);fit();document.getElementById('reload').onclick=()=>{document.getElementById('site').src='/index.html'};
</script></body></html>
